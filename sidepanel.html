<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Frame Room</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>

  <header class="bar">
    <div class="brand">
      <h1 class="wordmark">Frame<span>Room</span></h1>
      <span class="version" id="version"></span>
    </div>
    <div class="acct">
      <button id="link" class="link" type="button">
        <span class="dot" id="link-dot"></span>
        <span id="link-label">checking</span>
        <span class="caret">▾</span>
      </button>
      <div class="acct-menu is-hidden" id="acct-menu"></div>
    </div>
  </header>

  <div class="creditbar">
    <span class="credit-chip" id="credit-chip" title="">
      <span class="credit-mark">◈</span>
      <span id="credit-total">—</span>
      <span class="credit-word">credits</span>
    </span>
  </div>

  <nav class="modes" role="tablist">
    <button class="mode is-on" data-mode="image" role="tab" type="button">Image</button>
    <button class="mode" data-mode="animate" role="tab" type="button">Animate</button>
    <button class="mode" data-mode="frames" role="tab" type="button">Frames</button>
  </nav>

  <main class="deck">

    <section class="slots" id="slots">
      <button class="slot" data-slot="first" type="button">
        <span class="slot-key">01</span>
        <span class="slot-hint">Source</span>
      </button>
      <button class="slot is-hidden" data-slot="last" type="button">
        <span class="slot-key">02</span>
        <span class="slot-hint">Last frame</span>
      </button>
    </section>

    <label class="field">
      <span class="label">Prompt</span>
      <textarea id="prompt" rows="3" placeholder="What should happen in the frame?"></textarea>
    </label>

    <div class="grid">
      <label class="field">
        <span class="label">Model</span>
        <select id="model"></select>
      </label>

      <label class="field">
        <span class="label">Quality</span>
        <select id="quality"></select>
      </label>

      <label class="field" id="ratio-field">
        <span class="label">Ratio</span>
        <select id="ratio">
          <option>1:1</option>
          <option>16:9</option>
          <option>9:16</option>
          <option>4:3</option>
          <option selected>3:4</option>
          <option>5:4</option>
          <option>4:5</option>
          <option>3:2</option>
          <option>2:3</option>
          <option>21:9</option>
        </select>
      </label>

      <label class="field is-hidden" id="duration-field">
        <span class="label">Duration</span>
        <select id="duration">
          <option value="1">1s</option>
          <option value="2">2s</option>
          <option value="3">3s</option>
          <option value="4">4s</option>
          <option value="5" selected>5s</option>
          <option value="6">6s</option>
          <option value="7">7s</option>
          <option value="8">8s</option>
          <option value="9">9s</option>
          <option value="10">10s</option>
          <option value="11">11s</option>
          <option value="12">12s</option>
          <option value="13">13s</option>
          <option value="14">14s</option>
          <option value="15">15s</option>
        </select>
      </label>

      <label class="field">
        <span class="label">Count</span>
        <select id="count">
          <option>1</option>
          <option>2</option>
          <option>4</option>
        </select>
      </label>

      <label class="field seed">
        <span class="label">Seed</span>
        <span class="seed-row">
          <input id="seed" inputmode="numeric" />
          <button id="reroll" class="reroll" type="button" title="New seed">&#8634;</button>
        </span>
      </label>
    </div>

    <div class="toggles is-hidden" id="video-toggles">
      <button class="toggle" id="t-audio" type="button" aria-pressed="false">
        <span class="toggle-key">Audio</span>
        <span class="toggle-state">off</span>
      </button>
      <button class="toggle" id="t-preview" type="button" aria-pressed="false">
        <span class="toggle-key">Preview</span>
        <span class="toggle-state">off</span>
      </button>
      <button class="toggle" id="t-multishot" type="button" aria-pressed="false"
              title="Generate multi-shot video with model-native capabilities. For best results, use clips longer than 5 seconds">
        <span class="toggle-key">Multi&#8209;shot</span>
        <span class="toggle-state">off</span>
      </button>
    </div>

    <!-- the readout: one line of tape that says exactly what is about to happen,
         or exactly what is happening -->
    <output class="readout" id="readout">
      <span class="pip" id="pip"></span>
      <span id="readout-text">idle &middot; pick a source frame</span>
    </output>

    <button id="go" class="go" type="button">
      Generate<span class="go-cost" id="go-cost"></span>
    </button>

  </main>

  <section class="renders">
    <h2 class="label" id="renders-label">Renders</h2>
    <ul class="reel" id="reel">
      <li class="empty">Nothing rendered yet.</li>
    </ul>
    <button id="browse" class="browse" type="button">Browse all &rarr;</button>
  </section>

  <!-- library picker -->
  <div class="sheet is-hidden" id="picker">
    <div class="sheet-bar">
      <span class="label">Choose a frame</span>
      <button id="picker-close" class="ghost" type="button">Close</button>
    </div>
    <label class="field">
      <span class="label">paste a path or image URL</span>
      <span class="seed-row">
        <input id="manual-path" placeholder="upload/2026/..." />
        <button id="manual-use" class="ghost" type="button">Use</button>
      </span>
    </label>
    <label class="field">
      <span class="label">or upload from this machine</span>
      <span class="seed-row">
        <input id="upload-file" type="file" accept="image/png,image/jpeg,image/webp" />
      </span>
      <span class="acct-pwmsg" id="upload-msg"></span>
    </label>
    <ul class="tiles" id="tiles"></ul>
    <button class="ghost is-hidden" id="tiles-more" type="button"></button>
  </div>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>
